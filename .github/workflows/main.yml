name: Patch APK resources.arsc

on:
  workflow_dispatch:
    inputs:
      apk_path:
        description: 'ರೆಪೊಸಿಟರಿಯಲ್ಲಿರುವ APK ಫೈಲ್ ವಿಳಾಸ (ಉದಾ: input/SystemUI.apk)'
        required: true
        default: 'input/target.apk'
      framework_path:
        description: 'framework-res.apk ವಿಳಾಸ (ಅಗತ್ಯವಿದ್ದರೆ ಮಾತ್ರ ಹಾಕಿ)'
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Apktool & Build-Tools
        run: |
          wget -q https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool -O /usr/local/bin/apktool
          wget -q https://bitbucket.org/iBotPeaches/apktool/downloads/apktool_2.9.3.jar -O /usr/local/bin/apktool.jar
          chmod +x /usr/local/bin/apktool /usr/local/bin/apktool.jar
          
          BUILD_TOOLS=$(find $ANDROID_HOME/build-tools -maxdepth 1 | sort -V | tail -n 1)
          echo "$BUILD_TOOLS" >> $GITHUB_PATH

      - name: Install Framework (ಅಗತ್ಯವಿದ್ದರೆ)
        if: github.event.inputs.framework_path != ''
        run: apktool if "${{ github.event.inputs.framework_path }}"

      - name: Decode & Modify resources.arsc
        run: |
          apktool d -s "${{ github.event.inputs.apk_path }}" -o decoded_apk
          
          # ಉದಾಹರಣೆ 1: strings.xml ನಲ್ಲಿರುವ ಪದವನ್ನು ಬದಲಾಯಿಸಲು
          sed -i 's/Old Text/New Text/g' decoded_apk/res/values/strings.xml
          
          # ಉದಾಹರಣೆ 2: bools.xml ನಲ್ಲಿರುವ ಆಯ್ಕೆಯನ್ನು ಬದಲಾಯಿಸಲು
          # sed -i 's/<bool name="config_enableFeature">false<\/bool>/<bool name="config_enableFeature">true<\/bool>/g' decoded_apk/res/values/bools.xml

      - name: Rebuild, Align & Sign
        run: |
          apktool b decoded_apk -o unsigned.apk
          
          # Android 11+ ನಲ್ಲಿ resources.arsc ಕಂಪ್ರೆಸ್ (compress) ಆಗದಂತೆ 4-byte align ಮಾಡುವುದು
          zipalign -p -f -v 4 unsigned.apk aligned.apk
          
          # ಸೈನ್ ಮಾಡುವುದು (ಸಿಸ್ಟಮ್ APK ಮೂಲ ಸಿಗ್ನೇಚರ್ ಉಳಿಸಬೇಕಿದ್ದರೆ ಇದನ್ನು ಬಿಟ್ಟುಬಿಡಿ)
          keytool -genkey -v -keystore test.keystore -alias alias_name -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android,O=Android,C=US"
          apksigner sign --ks test.keystore --ks-pass pass:android --out patched.apk aligned.apk

      - name: Upload Patched APK
        uses: actions/upload-artifact@v4
        with:
          name: patched-apk
          path: patched.apk
